<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公众号文章改写工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fbfaf8;
    --surface: #ffffff;
    --surface2: #f7f5f1;
    --line: #e9e3da;
    --line2: #d9d1c6;
    --text: #27231f;
    --text2: #746f68;
    --text3: #a39c93;
    --accent: #df7657;
    --accent2: #b85d42;
    --accent-bg: #fff1e9;
    --ink: #28231f;
    --ink2: #3a2a22;
    --success: #4ca779;
    --success-bg: #e8f5ee;
    --error: #c85b4b;
    --error-bg: #fdecea;
    --warn: #c58a45;
    --radius: 18px;
    --font: 'Inter', 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    --mono: 'SF Mono', 'Fira Code', Consolas, monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  .header { display: none; }

  .badge {
    min-width: 94px;
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 800;
    color: var(--accent2);
    background: #fff;
    border: 1px solid var(--line);
    text-align: center;
    box-shadow: 0 8px 24px rgba(36,31,27,0.04);
  }

  .page-shell {
    width: min(1120px, calc(100vw - 48px));
    margin: 0 auto;
    padding: 54px 0 80px;
  }

  .back-link {
    color: #8c8780;
    font-weight: 650;
    margin-bottom: 34px;
  }

  .eyebrow {
    color: var(--accent2);
    font-size: 12px;
    letter-spacing: 3px;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .hero h1 {
    font-family: var(--serif);
    font-size: clamp(44px, 6vw, 70px);
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: 0;
    color: #25221f;
  }

  .hero p {
    color: #85817b;
    font-size: 18px;
    font-weight: 650;
    margin-top: 22px;
  }

  .quota-card {
    margin-top: 32px;
    border-radius: 18px;
    padding: 36px 48px 34px;
    background:
      radial-gradient(circle at 100% 0%, rgba(121,73,50,0.45), transparent 34%),
      linear-gradient(135deg, var(--ink), #2b241f 54%, var(--ink2));
    color: #f7f1ea;
    box-shadow: 0 22px 48px rgba(31,25,20,0.12);
  }

  .quota-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 34px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    color: #f5efe8;
    font-weight: 800;
  }

  .quota-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
  }

  .quota-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #58b889;
    box-shadow: 0 0 0 5px rgba(88,184,137,0.18);
  }

  .quota-sub {
    color: rgba(245,239,232,0.5);
    font-size: 13px;
    margin-left: 8px;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 24px;
    margin-top: 48px;
    align-items: start;
  }

  .section-title {
    font-family: var(--serif);
    font-size: 30px;
    line-height: 1.1;
    margin-bottom: 22px;
    color: #28231f;
    font-weight: 800;
  }

  .panel, .right-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 18px 44px rgba(36,31,27,0.04);
    overflow: hidden;
  }

  .right-panel {
    position: sticky;
    top: 108px;
  }

  .panel-header {
    padding: 20px 24px 14px;
    font-size: 12px;
    font-weight: 900;
    color: #292520;
    letter-spacing: 0.3px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
  }

  .panel-header span:first-child {
    font-size: 16px;
  }

  .upload-zone {
    margin: 26px 32px 18px;
    border: 1px dashed var(--line2);
    border-radius: 14px;
    padding: 34px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #fcfbf9;
  }

  .upload-zone:hover, .upload-zone.drag {
    border-color: var(--accent);
    background: var(--accent-bg);
  }

  .upload-zone .icon { font-size: 28px; margin-bottom: 10px; }
  .upload-zone strong { color: var(--text); font-size: 16px; display: block; margin-bottom: 4px; }
  .upload-zone p { color: var(--text3); font-size: 13px; }
  #fileInput { display: none; }

  .file-list { padding: 0 24px 28px; }

  .file-item {
    display: grid;
    grid-template-columns: 24px minmax(0,1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 16px 0;
    cursor: pointer;
    border-top: 1px solid var(--line);
  }

  .file-item:first-child { border-top: 0; }
  .file-item:hover .file-name { color: var(--accent2); }

  .file-status {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0;
    background: var(--text3);
    box-shadow: 0 0 0 4px rgba(163,156,147,0.14);
  }

  .file-status.done { background: var(--success); box-shadow: 0 0 0 4px rgba(76,167,121,0.14); }
  .file-status.error { background: var(--error); box-shadow: 0 0 0 4px rgba(200,91,75,0.14); }
  .file-status.running { background: var(--accent); box-shadow: 0 0 0 4px rgba(223,118,87,0.16); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(0.72); opacity: 0.65; } }

  .file-name { font-size: 15px; color: var(--text); font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-size { font-size: 12px; color: var(--text3); font-family: var(--mono); }

  .config-section {
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
  }

  .config-section label {
    font-size: 13px;
    color: #2c2824;
    font-weight: 850;
    display: block;
    margin-bottom: 8px;
  }

  input[type="text"], input[type="password"], textarea, select {
    width: 100%;
    background: #fcfbf9;
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-size: 13px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }

  input[type="text"], input[type="password"] { font-family: var(--mono); }
  textarea {
    font-family: var(--font);
    resize: vertical;
    min-height: 138px;
    line-height: 1.65;
  }

  input:focus, textarea:focus, select:focus {
    border-color: #d7b9a9;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(223,118,87,0.09);
  }

  .slider-row { display: flex; align-items: center; gap: 12px; }
  input[type="range"] { flex: 1; accent-color: var(--accent); }

  .slider-val {
    font-size: 13px;
    font-weight: 900;
    color: var(--accent2);
    min-width: 24px;
    text-align: right;
    font-family: var(--mono);
  }

  .btn {
    width: 100%;
    min-height: 54px;
    padding: 13px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    border: none;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: #24211d; color: #fff; box-shadow: 0 12px 28px rgba(36,31,27,0.14); }
  .btn-primary:hover { background: #111; }
  .btn-primary:disabled { background: #9c9a96; box-shadow: none; opacity: 1; cursor: not-allowed; transform: none; }
  .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--line); }
  .btn-outline:hover { background: #faf7f3; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 34px;
    padding-top: 32px;
  }

  .stat-box {
    background: transparent;
    text-align: left;
  }

  .stat-label {
    color: rgba(245,239,232,0.82);
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .stat-num {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 46px;
    line-height: 1;
    color: #fff;
    font-weight: 500;
  }

  .stat-num.green, .stat-num.red { color: #fff; }

  .progress-bar-wrap {
    margin-top: 22px;
    background: rgba(255,255,255,0.1);
    border-radius: 999px;
    height: 7px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #65c08d, #f2a879);
    border-radius: 999px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .token-info {
    font-size: 12px;
    color: var(--text3);
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
  }

  .token-info span { color: var(--accent2); font-weight: 800; }

  .action-row {
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .hint {
    font-size: 12px;
    color: #3b6c96;
    margin: 0 24px 18px;
    padding: 14px 16px;
    background: #eaf4ff;
    border: 1px solid #d6e8f8;
    border-radius: 12px;
  }

  .log-area {
    padding: 12px 24px 24px;
    max-height: 220px;
    overflow: auto;
  }

  .log-item {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text3);
    padding: 4px 0;
    display: flex;
    gap: 8px;
  }

  .log-item.ok { color: var(--success); }
  .log-item.err { color: var(--error); }
  .log-item.info { color: var(--accent2); }
  .log-time { flex-shrink: 0; opacity: 0.65; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d7cfc4; border-radius: 999px; }

  @media (max-width: 860px) {
    .page-shell { width: min(100vw - 28px, 1120px); padding-top: 30px; }
    .layout { grid-template-columns: 1fr; }
    .right-panel { position: static; }
    .quota-card { padding: 26px 24px; }
    .stats-row { grid-template-columns: 1fr; gap: 20px; }
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
</style>
</head>
<body>

<main class="page-shell">
  <div class="back-link">← 返回工具</div>
  <div class="eyebrow">TOOLS · 文章改写</div>
  <section class="hero">
    <h1>批量改写</h1>
    <p>上传 HTML 文件，通过安全代理调用 DeepSeek，一键导出改写结果。</p>
  </section>

  <section class="quota-card">
    <div class="quota-head">
      <div class="quota-title">
        <span class="quota-dot"></span>
        <span>处理概览</span>
        <span class="quota-sub">HTML 批量改写</span>
      </div>
      <span>今日任务</span>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">总计</div>
        <div class="stat-num" id="statTotal">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">完成</div>
        <div class="stat-num green" id="statDone">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">失败</div>
        <div class="stat-num red" id="statFail">0</div>
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </section>

<div class="layout">

  <!-- LEFT: File List -->
  <section>
  <h2 class="section-title">导入文章</h2>
  <div class="panel">
    <div class="panel-header">
      <span>文件列表</span>
      <span id="fileCount" style="color:var(--accent2);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;">0 篇</span>
    </div>

    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📂</div>
      <strong>点击或拖拽上传</strong>
      <p>支持多选 .html / .htm 文件</p>
    </div>
    <input type="file" id="fileInput" multiple accept=".html,.htm">

    <div class="file-list" id="fileList"></div>
  </div>
  </section>

  <!-- RIGHT: Config & Control -->
  <section>
  <h2 class="section-title">改写配置</h2>
  <div class="right-panel">
    <div class="panel-header">
      <span>配置 &amp; 控制</span>
    </div>

    <div class="config-section">
      <label>代理 API 地址</label>
      <input type="text" id="proxyUrl" value="https://article-rewriting-api.xuelong528.workers.dev" placeholder="https://your-worker.your-subdomain.workers.dev">
    </div>

    <div class="config-section">
      <label>访问令牌</label>
      <input type="password" id="accessToken" placeholder="Worker ACCESS_TOKEN">
    </div>

    <div class="config-section">
      <label>模型</label>
      <select id="modelSelect" onchange="estimateCost()">
        <option value="deepseek-v4-flash">deepseek-v4-flash（日常推荐）</option>
        <option value="deepseek-v4-pro">deepseek-v4-pro（质量更高，含思考模式）</option>
      </select>
    </div>

    <div class="config-section">
      <label>并发数</label>
      <div class="slider-row">
        <input type="range" id="concurrency" min="1" max="5" value="3" oninput="document.getElementById('concVal').textContent=this.value">
        <span class="slider-val" id="concVal">3</span>
      </div>
    </div>

    <div class="config-section">
      <label>温度（creativity）</label>
      <div class="slider-row">
        <input type="range" id="temperature" min="0" max="10" value="7" oninput="document.getElementById('tempVal').textContent=(this.value/10).toFixed(1)">
        <span class="slider-val" id="tempVal">0.7</span>
      </div>
    </div>

    <div class="config-section">
      <label>System Prompt</label>
      <textarea id="systemPrompt">你是一位专业的公众号教程文章编辑。请将用户提供的教程文章润色改写为 HTML 片段，要求：
1. 输出一个更直接的大标题，用 h1 标签，标题要点出工具名称及核心作用
2. 保留原文主要结构和步骤顺序，不新增未经确认的技术事实
3. 只做润色、重组表达和降低相似度，不要大幅改变内容含义
4. 保留所有 [IMAGE_N] 占位符，位置不变，建议单独放在 p 标签中
5. 使用 h1、h2、h3、p、strong、em、ul、ol、li、blockquote、code、pre、hr、br 等基础 HTML 标签
6. 不要输出 Markdown，不要输出 ```html 代码块，不要输出完整 html/head/body，只输出 article 内部 HTML 片段</textarea>
    </div>

    <div class="token-info">
      预计费用：<span id="costEst">—</span> &nbsp;·&nbsp; 已用 Token：<span id="tokenUsed">0</span>
    </div>

    <div class="action-row">
      <button class="btn btn-primary" id="runBtn" onclick="startProcessing()" disabled>
        ▶ 开始改写全部
      </button>
      <button class="btn btn-outline" id="retryBtn" onclick="retryFailed()" style="display:none">
        ↺ 重试失败文件
      </button>
      <button class="btn btn-outline" onclick="downloadAll()" id="dlBtn" disabled>
        ↓ 导出全部结果
      </button>
    </div>

    <div class="hint">DeepSeek API Key 仅保存在代理服务端。前端只保存本次页面输入，刷新页面数据清空。</div>

    <div class="panel-header" style="margin-top:4px;">
      <span>运行日志</span>
      <button onclick="document.getElementById('logArea').innerHTML=''" style="background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;">清空</button>
    </div>
    <div class="log-area" id="logArea"></div>
  </div>
  </section>

</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const state = {
  files: [],        // { name, size, html, text, images, status, result, error }
  activeIdx: -1,
  running: false,
  totalTokens: 0,
  doneCount: 0,
  failCount: 0,
};

// ──────────────────── File Upload ────────────────────
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('drag');
  handleFiles(Array.from(e.dataTransfer.files).filter(f => /\.html?$/.test(f.name)));
});
fileInput.addEventListener('change', e => handleFiles(Array.from(e.target.files)));

function handleFiles(files) {
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const html = e.target.result;
      const { text, images } = parseHTML(html);
      state.files.push({ name: file.name, size: file.size, html, text, images, status: 'pending', result: null, error: null });
      loaded++;
      if (loaded === files.length) {
        updateFileList();
        updateStats();
        estimateCost();
      }
    };
    reader.readAsText(file, 'UTF-8');
  });
}

// ──────────────────── HTML Parser ────────────────────
function parseHTML(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  // Try common WeChat containers, fallback to body
  const body = doc.querySelector('.rich_media_content, #js_content, article, .post-body, body');

  const images = [];
  let imgIdx = 0;
  body.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src') || img.getAttribute('data-src') || '';
    images.push({ idx: imgIdx, tag: img.outerHTML, src });
    const placeholder = doc.createTextNode(`[IMAGE_${imgIdx}]`);
    img.replaceWith(placeholder);
    imgIdx++;
  });

  // Remove scripts, styles, nav
  body.querySelectorAll('script, style, nav, .qr_code, .reward_area').forEach(el => el.remove());

  const text = body.innerText || body.textContent || '';
  return { text: text.replace(/\n{3,}/g, '\n\n').trim(), images };
}

// ──────────────────── File List UI ────────────────────
function updateFileList() {
  const list = document.getElementById('fileList');
  document.getElementById('fileCount').textContent = `${state.files.length} 篇`;
  const headerBadge = document.getElementById('headerBadge');
  if (headerBadge) headerBadge.textContent = `${state.files.length} 篇已加载`;
  document.getElementById('runBtn').disabled = state.files.length === 0 || state.running;
  document.getElementById('dlBtn').disabled = state.files.filter(f => f.status === 'done').length === 0;

  list.innerHTML = state.files.map((f, i) => `
    <div class="file-item ${state.activeIdx === i ? 'active' : ''}" onclick="selectFile(${i})">
      <div class="file-status ${f.status === 'done' ? 'done' : f.status === 'error' ? 'error' : f.status === 'running' ? 'running' : ''}">
        ${f.status === 'done' ? '✓' : f.status === 'error' ? '✕' : f.status === 'running' ? '◌' : '·'}
      </div>
      <span class="file-name" title="${f.name}">${f.name}</span>
      <span class="file-size">${formatSize(f.size)}</span>
    </div>
  `).join('');
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + 'B';
  return (bytes / 1024).toFixed(1) + 'K';
}

function selectFile(idx) {
  state.activeIdx = idx;
  updateFileList();
}

// ──────────────────── Stats ────────────────────
function updateStats() {
  const total = state.files.length;
  const done = state.files.filter(f => f.status === 'done').length;
  const fail = state.files.filter(f => f.status === 'error').length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statFail').textContent = fail;
  const pct = total > 0 ? (done + fail) / total * 100 : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('dlBtn').disabled = done === 0;
  document.getElementById('retryBtn').style.display = fail > 0 ? 'flex' : 'none';
}

function estimateCost() {
  const chars = state.files.reduce((s, f) => s + f.text.length, 0);
  const tokens = Math.ceil(chars * 1.5);
  const model = document.getElementById('modelSelect')?.value || 'deepseek-v4-flash';
  const pricing = model === 'deepseek-v4-pro'
    ? { input: 3, output: 6 }
    : { input: 1, output: 2 };
  const inputCost = (tokens / 1e6) * pricing.input;
  const outputCost = (tokens / 1e6) * pricing.output;
  const total = (inputCost + outputCost).toFixed(3);
  document.getElementById('costEst').textContent = `约 ¥${total}`;
}

// ──────────────────── API Call ────────────────────
async function callRewriteProxy(text, proxyUrl, accessToken, model, temperature, retries = 3) {
  const systemPrompt = document.getElementById('systemPrompt').value;
  for (let attempt = 0; attempt < retries; attempt++) {
    try {
      const resp = await fetch(`${proxyUrl}/rewrite`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Access-Token': accessToken
        },
        body: JSON.stringify({
          model,
          temperature,
          systemPrompt,
          text
        })
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${resp.status}`);
      }
      const data = await resp.json();
      const usage = data.usage || {};
      state.totalTokens += (usage.total_tokens || 0);
      document.getElementById('tokenUsed').textContent = state.totalTokens.toLocaleString();
      return data.content;
    } catch (err) {
      if (attempt === retries - 1) throw err;
      await sleep((attempt + 1) * 1500);
    }
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ──────────────────── Processing ────────────────────
async function startProcessing() {
  const proxyUrl = document.getElementById('proxyUrl').value.trim().replace(/\/+$/, '');
  const accessToken = document.getElementById('accessToken').value.trim();
  if (!proxyUrl) { alert('请先填写代理 API 地址'); return; }
  if (!accessToken) { alert('请先填写访问令牌'); return; }

  const pending = state.files.filter(f => f.status === 'pending');
  if (pending.length === 0) { addLog('没有待处理的文件', 'info'); return; }

  state.running = true;
  document.getElementById('runBtn').disabled = true;
  document.getElementById('runBtn').textContent = '⏳ 处理中...';

  const model = document.getElementById('modelSelect').value;
  const temperature = parseFloat(document.getElementById('temperature').value) / 10;
  const concurrency = parseInt(document.getElementById('concurrency').value);

  addLog(`开始处理 ${pending.length} 篇文章，并发数 ${concurrency}`, 'info');

  const queue = [...state.files.filter(f => f.status === 'pending')];
  let active = 0;

  async function processNext() {
    if (queue.length === 0) return;
    const f = queue.shift();
    const idx = state.files.indexOf(f);
    active++;

    f.status = 'running';
    updateFileList();
    addLog(`开始处理: ${f.name}`);

    try {
      const result = await callRewriteProxy(f.text, proxyUrl, accessToken, model, temperature);
      f.result = result;
      f.status = 'done';
      addLog(`完成: ${f.name}`, 'ok');
    } catch (err) {
      f.status = 'error';
      f.error = err.message;
      addLog(`失败: ${f.name} — ${err.message}`, 'err');
    }

    updateFileList();
    updateStats();

    active--;
    if (queue.length > 0) processNext();
  }

  const workers = Array.from({ length: Math.min(concurrency, pending.length) }, () => processNext());
  await Promise.all(workers.map(async w => {
    await w;
    while (queue.length > 0 || active > 0) await sleep(300);
  }));

  state.running = false;
  document.getElementById('runBtn').disabled = false;
  document.getElementById('runBtn').textContent = '▶ 开始改写全部';
  const doneCount = state.files.filter(f => f.status === 'done').length;
  addLog(`全部完成！成功 ${doneCount} 篇，失败 ${state.files.filter(f=>f.status==='error').length} 篇`, 'info');
}

async function retryFailed() {
  state.files.filter(f => f.status === 'error').forEach(f => { f.status = 'pending'; f.error = null; });
  updateFileList(); updateStats();
  await startProcessing();
}

// ──────────────────── Export ────────────────────
async function downloadAll() {
  const done = state.files.filter(f => f.status === 'done');
  if (done.length === 0) return;

  const zip = new JSZip();
  done.forEach(f => {
    const restored = restoreImages(f.result, f.images, f.html);
    zip.file(f.name.replace(/\.html?$/, '_rewritten.html'), restored);
  });

  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'rewritten_articles.zip';
  a.click();
  URL.revokeObjectURL(url);
  addLog(`已导出 ${done.length} 篇改写文章`, 'ok');
}

function stripCodeFence(html) {
  return String(html || '')
    .replace(/^```(?:html)?\s*/i, '')
    .replace(/```\s*$/i, '')
    .trim();
}

function sanitizeArticleHtml(html) {
  const template = document.createElement('template');
  template.innerHTML = html;
  const allowedTags = new Set(['H1','H2','H3','P','STRONG','EM','UL','OL','LI','BLOCKQUOTE','CODE','PRE','HR','BR','A']);
  const allowedAttrs = { A: new Set(['href', 'title', 'target', 'rel']) };

  function clean(node) {
    [...node.children].forEach(child => {
      if (!allowedTags.has(child.tagName)) {
        child.replaceWith(...child.childNodes);
        return;
      }
      [...child.attributes].forEach(attr => {
        const allowed = allowedAttrs[child.tagName]?.has(attr.name);
        if (!allowed) child.removeAttribute(attr.name);
      });
      if (child.tagName === 'A') {
        const href = child.getAttribute('href') || '';
        if (!/^https?:\/\//i.test(href)) child.removeAttribute('href');
        child.setAttribute('target', '_blank');
        child.setAttribute('rel', 'noopener noreferrer');
      }
      clean(child);
    });
  }

  clean(template.content);
  return template.innerHTML.trim();
}

// ──────────────────── Log ────────────────────
function addLog(msg, type = '') {
  const area = document.getElementById('logArea');
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  const div = document.createElement('div');
  div.className = `log-item ${type}`;
  div.innerHTML = `<span class="log-time">${time}</span><span>${escapeHtml(msg)}</span>`;
  area.insertBefore(div, area.firstChild);
  if (area.children.length > 80) area.removeChild(area.lastChild);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
